experiences:
  title: Experiencia
  info:
  - role: Senior Backend Engineer
    time: 2024 - actualidad
    company: Qindel — Inditex · core retail
    details:
      mixto: |
        Migración del core de negocio desde legacy hacia **Java 25**, **arquitectura hexagonal** y **microservicios** (Spring Boot, Spring Cloud, Maven) sobre **AWS**. Referencia técnica en diseño y evolución del nuevo sistema.

        En curso: sustituir procesos batch que hoy tardan **horas** por **datos operativos casi en tiempo real** en el entorno retail.

        Roadmap incremental en **Agile** sin cortar servicio. Diseño de **APIs RESTful** con **OpenAPI**, contratos entre servicios, **Testcontainers** y **TDD**. Redacción técnica de diseños y contratos de API.
      tecnico: |
        Migración del core de negocio Inditex: **Java 25**, **Spring Boot / Spring Framework**, **Spring Cloud**, **Maven**, **arquitectura hexagonal** y **microservicios**, con plataforma en **AWS**.

        Definición e implementación de **APIs RESTful** con **OpenAPI**; contratos entre servicios; bases de datos **SQL** en el dominio retail. Prácticas **TDD**, **JUnit**, **Mockito**, **Testcontainers**.

        Trabajo en **metodología Agile**; **redacción técnica** de diseños de arquitectura, ADRs y documentación de APIs. Roadmap incremental sin cortar servicio: batch de horas → datos operativos casi en tiempo real.
      funcional: |
        Referencia técnica en la modernización del core de negocio Inditex (entorno **AWS**): evolucionar el legacy hacia una arquitectura de servicios mantenible y operable.

        Impulso un roadmap incremental que sustituye batchs de horas por datos casi en tiempo real, sin interrumpir el negocio. Facilito acuerdos de contrato entre equipos, calidad mediante TDD y documentación clara para quien construye y opera el sistema.

  - role: Senior Backend Engineer
    time: 2020 - 2024
    company: Vitro · I+D sector salud
    details:
      mixto: |
        Desarrollo en equipo de una plataforma **Java/Spring Boot** (Maven) para sector salud, desde el diseño inicial hasta producción. **APIs RESTful**, datos **SQL/NoSQL** según caso de uso.

        Responsable del módulo **analítico y de datos**: recolección **multicentro** en hospitales con varias sedes y procesamiento de actualizaciones **casi en tiempo real**.

        Módulos desplegables **offline**; datos sensibles con cumplimiento normativo. Formaciones internas semanales (**redacción y transmisión técnica**). Generadores de código y librerías internas. Trabajo en **Agile**.
      tecnico: |
        Plataforma sanitaria **Java / Spring Boot / Spring Framework** construida con **Maven**: diseño e implementación de **APIs RESTful**, persistencia **SQL** y componentes **NoSQL** donde aportaban (analítica/búsqueda).

        Módulo analítico multicentro: sincronización casi en tiempo real entre sedes; despliegues offline; cumplimiento normativo sobre datos sensibles.

        **Microservicios**/módulos desplegables, tests automatizados, generadores de código. **Metodología Agile** y **redacción técnica** en formaciones internas semanales del equipo de I+D.
      funcional: |
        Parte del I+D que levantó una plataforma sanitaria de cero hasta producción. Responsable del módulo analítico multicentro: datos casi en tiempo real entre sedes hospitalarias y operación offline donde no hay conectividad.

        Impulsé formaciones internas rotativas, librerías compartidas y generadores para reducir trabajo repetitivo, alineando entrega técnica con requisitos clínicos y normativos.

  - role: Senior Backend Engineer
    time: 2018 - 2020
    company: Metaenlace — Tempe / Inditex · migración legacy
    details:
      mixto: |
        Tras cambios regulatorios, **proyecto end-to-end en solitario**: servicios de **más de 20 minutos** de respuesta reducidos a **menos de 3 segundos** con cachés, rediseño de procesos y optimización.

        Migración de monolitos legacy a arquitectura moderna; definición de arquitectura junto al Tech Lead. **Java**, **APIs**, **SQL**, **TDD**, generadores de código. Stack también **.NET** y **RPA (Blue Prism)**.
      tecnico: |
        Proyecto end-to-end en solitario tras cambios regulatorios: latencias de **>20 min** a **<3 s** mediante cachés, rediseño y optimización en **Java**.

        Migración de monolitos a arquitectura moderna orientada a servicios; **APIs**, acceso a datos **SQL**, **Maven**/build enterprise, **TDD** en todos los desarrollos. Colaboración en definición de arquitectura con el Tech Lead. También **.NET** y **RPA (Blue Prism)** según necesidad del cliente.
      funcional: |
        Encargo end-to-end en solitario tras cambios regulatorios: pasé servicios de más de 20 minutos a menos de 3 segundos, desbloqueando operación de negocio.

        Coordiné con el Tech Lead la migración de monolitos legacy y dejé generadores y prácticas TDD reutilizables entre equipos.

  - role: Backend Engineer
    time: 2015 - 2018
    company: Everis — ICO & SEPE · financiero y público
    details:
      mixto: |
        **ICO (financiero):** liderazgo de un equipo de **3 personas** en la migración del módulo de **seguridad**: **Angular** + **Spring Security**, conviviendo con legacy mientras se migraban monolitos y **microservicios** (**Java**, **Maven**, **SQL**).

        **SEPE (público):** fullstack **Java 8/JSF**; reporting masivo con **JasperReports**. Entornos **Agile**.
      tecnico: |
        **ICO:** liderazgo técnico de 3 personas en migración del módulo de seguridad: **Angular**, **Spring Security / Spring Framework**, **Java**, **Maven**, **APIs**, bases de datos **SQL**, convivencia monolitos/**microservicios** sin cortar servicio.

        **SEPE:** desarrollo fullstack **Java 8/JSF** y motor de reporting **JasperReports**. Trabajo en **metodología Agile**; documentación y traspaso técnico al equipo.
      funcional: |
        En ICO lideré un equipo de 3 personas en la migración del módulo de seguridad de la plataforma, manteniendo el servicio durante el cambio.

        En SEPE entregué reporting masivo y desarrollo fullstack en un contexto de administración pública, con foco en fiabilidad y entrega continua bajo Agile.

