career-profile:
  title: Sobre mí
  summary:
    mixto: |
      Backend senior en **Java/Spring** con más de once años en producción en retail (Inditex), financiero, salud y administración pública. Me ocupo sobre todo de **arquitectura y migraciones**: sacar sistemas legacy, diseñar **microservicios** que aguanten picos de carga y mantener el servicio mientras cambias piezas debajo.

      Experiencia sólida en **Spring Boot / Spring Framework**, **Maven**, definición e implementación de **APIs RESTful**, bases de datos **SQL y NoSQL**, y trabajo en **metodología Agile**. Redacción técnica (OpenAPI, docs de arquitectura, formaciones).

      En **Qindel** (cliente Inditex) participo en la modernización del core de negocio: arquitectura hexagonal, Java 25, microservicios y entorno **AWS**. En **Vitro** formé parte del equipo de I+D que levantó una plataforma sanitaria desde cero. Apoyo al equipo con **tests automatizados**, generadores de código y librerías compartidas.
    tecnico: |
      Senior Backend Engineer con **más de 11 años de experiencia sólida en Java** (> 5 años exigidos) en entornos de producción (retail Inditex, financiero, salud y administración pública).

      Experiencia sólida con **Spring Boot / Spring Framework** (incl. Spring Boot 3.x, Spring Cloud, Spring Security), **Maven** como herramienta de construcción, y **definición e implementación de APIs RESTful** (OpenAPI/Swagger, contratos entre servicios).

      Conocimiento de bases de datos **SQL** (PostgreSQL, Oracle) y **NoSQL** (MongoDB, Elasticsearch). Experiencia con **arquitectura de microservicios**, **metodología Agile** (Scrum/Kanban) y **capacidad de redacción técnica** (diseño de APIs, documentación de arquitectura, formaciones internas).

      Stack habitual: Hibernate/JPA, Liquibase/Flyway, Docker, Kubernetes/OpenShift, Kafka, RabbitMQ, JMS, Jenkins, SonarQube, TDD y Testcontainers. En cloud: **AWS** (puesto actual); en stack también **API Gateway** y **Lambda**.

      En **Qindel** (Inditex): modernización del core con Java 25, arquitectura hexagonal, microservicios Spring y **AWS**. En **Vitro** (salud): plataforma Java/Spring Boot desde cero; módulo analítico multicentro. Combino backend con Angular/TypeScript cuando el proyecto lo pide.
    funcional: |
      Backend senior con más de once años ayudando a negocio a **modernizar sistemas críticos** sin cortar servicio: retail (Inditex), financiero, salud y administración pública.

      Me centro en **arquitectura, migraciones y entrega incremental**: sacar legacy, diseñar servicios que escalen y alinear equipos técnicos con objetivos de negocio. En Qindel (Inditex), en entorno **AWS**, impulso la evolución del core hacia datos operativos casi en tiempo real. En Vitro participé en el I+D de una plataforma sanitaria multicentro desde cero.

      Acostumbrado a **metodologías Agile**, liderazgo técnico de equipos pequeños, formaciones internas y **redacción técnica** clara para stakeholders y desarrollo. Combino visión de producto con rigor de ingeniería.

