---
#Add "layout: compress" here to compress the html code
---
<!DOCTYPE html>
<!--[if IE 8]> <html lang="en" class="ie8"> <![endif]-->
<!--[if IE 9]> <html lang="en" class="ie9"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en"> <!--<![endif]-->
{% include head.html %}

<body>
  {% include assign-cv-view.html %}
  <div class="floating-controls d-print-none" data-cv-view="{{ cv_view }}" data-cv-pdf="{% if cv_view_meta %}{{ cv_view_meta.pdf }}{% else %}Daniel_Quirant_Rico_CV.pdf{% endif %}">
    {% include view-switcher.html %}
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Cambiar tema claro/oscuro" title="Tema claro/oscuro">
      <i class="fas fa-moon" id="themeIcon" aria-hidden="true"></i>
    </button>
    <button type="button" onclick="generatePDF(event)" class="pdf-button" id="pdfButton">
      <i class="fas fa-file-pdf"></i> Descargar PDF
    </button>
  </div>

  <div class="wrapper">
    {% include sidebar.html %}

    <div class="main-wrapper">
      {{ content }}
    </div>
  </div>

  {% include footer.html %}

  {% include scripts.html %}
  <script src="{{ site.baseurl }}/assets/js/pdf-generator.js"></script>
</body>

</html>
