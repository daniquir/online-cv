#Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: Daniel Quirant Rico — Senior Backend Engineer
url: 'https://daniquir.github.io'

#change it according to your repository name
# disabling since we are using a custom domain
baseurl: '/online-cv'

description: CV de Daniel Quirant Rico. Senior Backend Engineer especializado en Java/Spring, microservicios y arquitectura hexagonal. Experiencia en Inditex, sector financiero, salud y administración pública.
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: cave # blue turquoise green berry orange ceramic teal oceanstale cave
chrome_mobile_color: "#1a1f26"

# Tracker
#analytics: UA-83979019-1

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes
exclude:
  - assets/pdf
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - scripts
  - package.json
  - package-lock.json
  - generate-pdf.sh
  - serve.sh
  - docker-compose.yml
  - README.md
  - LICENSE.md
  - scripts/test-cv-views.rb

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
